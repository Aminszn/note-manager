[package]
name = "notes-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
password-hash = "0.5"
colored = "3"
dialoguer = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }